<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Call Of The Abyss">
  <defs>
    <radialGradient id="abyssBG" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#3a1456"/>
      <stop offset="55%" stop-color="#0e0420"/>
      <stop offset="100%" stop-color="#020008"/>
    </radialGradient>
    <radialGradient id="eyeGlow" cx="40%" cy="40%" r="60%">
      <stop offset="0%"  stop-color="#ffd2ff"/>
      <stop offset="35%" stop-color="#c44dff"/>
      <stop offset="80%" stop-color="#3a0e54"/>
      <stop offset="100%" stop-color="#0a0212"/>
    </radialGradient>
    <linearGradient id="tentStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#7228a0"/>
      <stop offset="60%" stop-color="#3a0e54"/>
      <stop offset="100%" stop-color="#160422"/>
    </linearGradient>
    <linearGradient id="crabBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#ff8a3a"/>
      <stop offset="100%" stop-color="#c41a3a"/>
    </linearGradient>
    <filter id="eyeBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- Outer gold rune ring + abyssal disc -->
  <circle cx="128" cy="128" r="124" fill="url(#abyssBG)"/>
  <circle cx="128" cy="128" r="124" fill="none" stroke="#FFD700" stroke-width="2" opacity="0.85"/>
  <circle cx="128" cy="128" r="116" fill="none" stroke="#7228a0" stroke-width="1" opacity="0.5"/>

  <!-- Four tentacles curling in from the corners -->
  <g fill="none" stroke="url(#tentStroke)" stroke-width="20" stroke-linecap="round">
    <path d="M 18 60   Q 70 55, 96 105"/>
    <path d="M 238 60  Q 186 55, 160 105"/>
    <path d="M 18 196  Q 70 201, 96 151"/>
    <path d="M 238 196 Q 186 201, 160 151"/>
  </g>

  <!-- Sucker accents along the tentacles -->
  <g fill="#c44dff">
    <circle cx="40"  cy="61"  r="3"/>
    <circle cx="68"  cy="69"  r="3.5"/>
    <circle cx="94"  cy="86"  r="4"/>
    <circle cx="216" cy="61"  r="3"/>
    <circle cx="188" cy="69"  r="3.5"/>
    <circle cx="162" cy="86"  r="4"/>
    <circle cx="40"  cy="195" r="3"/>
    <circle cx="68"  cy="187" r="3.5"/>
    <circle cx="94"  cy="170" r="4"/>
    <circle cx="216" cy="195" r="3"/>
    <circle cx="188" cy="187" r="3.5"/>
    <circle cx="162" cy="170" r="4"/>
  </g>

  <!-- Central glowing eye / portal -->
  <circle cx="128" cy="128" r="46" fill="url(#eyeGlow)" opacity="0.9" filter="url(#eyeBlur)"/>
  <circle cx="128" cy="128" r="40" fill="url(#eyeGlow)"/>
  <circle cx="128" cy="128" r="40" fill="none" stroke="#FFD700" stroke-width="1.5" opacity="0.85"/>
  <!-- Vertical pupil slit (eldritch eye) -->
  <ellipse cx="128" cy="128" rx="4" ry="22" fill="#0a0212"/>
  <!-- Specular catchlight -->
  <circle cx="118" cy="116" r="6" fill="rgba(255,255,255,0.85)"/>

  <!-- Crab silhouette under the eye -->
  <g transform="translate(128, 188)">
    <ellipse cx="0" cy="0" rx="22" ry="11" fill="url(#crabBody)" stroke="#1a0608" stroke-width="1.5"/>
    <!-- Shell ridges -->
    <path d="M -14 -2 Q 0 -8, 14 -2" stroke="#1a0608" stroke-width="1.2" fill="none" opacity="0.5"/>
    <!-- Pincer arms -->
    <path d="M -22 -2 q -8 -2 -12 -8 q 4 0 7 4" fill="url(#crabBody)" stroke="#1a0608" stroke-width="1.2"/>
    <path d="M 22 -2 q 8 -2 12 -8 q -4 0 -7 4" fill="url(#crabBody)" stroke="#1a0608" stroke-width="1.2"/>
    <!-- Legs -->
    <g stroke="#c41a3a" stroke-width="2.5" stroke-linecap="round">
      <line x1="-16" y1="6"  x2="-26" y2="14"/>
      <line x1="-9"  y1="9"  x2="-15" y2="20"/>
      <line x1="9"   y1="9"  x2="15"  y2="20"/>
      <line x1="16"  y1="6"  x2="26"  y2="14"/>
    </g>
    <!-- Eye stalks -->
    <line x1="-6" y1="-6" x2="-9"  y2="-13" stroke="#1a0608" stroke-width="1.5"/>
    <line x1="6"  y1="-6" x2="9"   y2="-13" stroke="#1a0608" stroke-width="1.5"/>
    <circle cx="-9" cy="-13" r="2" fill="#1a0608"/>
    <circle cx="9"  cy="-13" r="2" fill="#1a0608"/>
  </g>
</svg>
